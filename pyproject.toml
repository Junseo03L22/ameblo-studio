[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ameblo-studio"
version = "0.1.0"
description = "한국어 UI의 독립 구현 Ameblo 데스크톱 작성 도구"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "playwright>=1.51,<2", "python-dotenv>=1.0,<2", "platformdirs>=4,<5", "filelock>=3.17,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.12,<7"]

[project.scripts]
ameblo-studio = "ameblo_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["ameblo_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires launching a local Chromium process"]
